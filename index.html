  try{
    const d=frame.contentDocument,w=frame.contentWindow;
    const style=d.createElement('style');
    style.textContent=`
      html,body{height:100%!important;overflow:hidden!important;background:#f7f1e7!important}
      .stage{height:100dvh!important;min-height:0!important;padding:0!important;display:block!important;background:#f7f1e7!important}
      .phone{position:relative!important;width:100%!important;max-width:none!important;height:100dvh!important;max-height:none!important;border-radius:0!important;border:0!important;box-shadow:none!important;margin:0!important}
      .screen{overscroll-behavior:contain!important}
      .heroWelcome{background:linear-gradient(180deg,rgba(1,45,43,.06),rgba(1,49,46,.22) 40%,rgba(4,45,42,.88) 100%),url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=88') center/cover!important}

      .welcomeContent .tagline{color:#f7f0e5!important;font-size:10px!important;letter-spacing:.22em!important;line-height:1.7!important;margin-top:10px!important}
      .coverOrb{width:150px;height:150px;border-radius:50%;margin:34px auto 16px;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.98) 0 12%,rgba(226,250,244,.86) 25%,rgba(148,219,203,.58) 49%,rgba(63,146,132,.38) 72%,rgba(8,64,60,.16) 100%);box-shadow:0 0 0 18px rgba(255,255,255,.08),0 0 64px rgba(135,236,210,.36),inset 0 0 32px rgba(255,255,255,.86);animation:coverFloat 5s ease-in-out infinite}
      @keyframes coverFloat{50%{transform:translateY(-7px) scale(1.03)}}
      .mhtMark{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;color:rgba(255,255,255,.82);font-size:10px;letter-spacing:.05em}.mhtMark img{width:34px;height:34px;object-fit:contain;border-radius:50%}
      .nav{grid-template-columns:repeat(3,1fr)!important}.nav button[data-id='kamiPage'] b{width:44px;height:44px;border-radius:50%;margin:-17px auto 2px!important;background:radial-gradient(circle at 34% 28%,#fff 0 14%,#e0faf3 28%,#8fd2c3 54%,#3d9184 76%,#0b5954 100%);color:transparent!important;box-shadow:0 9px 22px rgba(11,89,84,.24),inset 0 0 14px rgba(255,255,255,.72)}
      .bubble.k{position:relative;padding-left:54px!important;border-top-left-radius:8px!important}.bubble.k:before{content:'';position:absolute;left:13px;top:12px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff 0 17%,#fff5e5 36%,#9ddbd0 63%,#3a8f82 100%);box-shadow:0 0 14px rgba(132,219,208,.35)}.bubble.u{border-top-right-radius:8px!important}
      .breathPicker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 4px}.breathPicker button{border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 8px;background:rgba(255,255,255,.08);color:#fff;font-size:10px;line-height:1.25}.breathPicker button.active{background:#fff;color:#0b5954;font-weight:700}.breathPicker small{display:block;opacity:.7;font-size:9px;margin-top:3px}
      .breathQuick{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 0}.breathQuick button{border:1px solid rgba(11,89,84,.09);background:#fff;border-radius:18px;padding:12px;text-align:left;color:#243b39;box-shadow:0 8px 20px rgba(35,69,64,.05)}.breathQuick b{display:block;font-family:'Cormorant Garamond',serif;font-size:18px;color:#0b5954}.breathQuick small{display:block;color:#7d7b73;font-size:9px;margin-top:4px;line-height:1.35}
      .todayMiniTitle{font-family:'Cormorant Garamond',serif;font-size:23px;margin:22px 0 10px}.todayBreathStrip{display:flex;gap:9px;overflow:auto;padding-bottom:3px;scrollbar-width:none}.todayBreathStrip::-webkit-scrollbar{display:none}.todayBreathStrip button{min-width:142px;border:0;border-radius:20px;padding:13px;background:linear-gradient(150deg,#0e675f,#0a4b47);color:#fff;text-align:left}.todayBreathStrip b{display:block;font-size:12px}.todayBreathStrip span{display:block;font-size:10px;opacity:.75;margin-top:4px}
      .logoSpace{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid rgba(11,89,84,.06);border-radius:21px;padding:12px;margin:16px 0}.logoSpace img{width:48px;height:48px;object-fit:contain}.logoSpace strong{display:block;font-size:13px}.logoSpace small{color:#7d7b73;font-size:10px;line-height:1.35}
      @media(min-width:700px){.phone{height:100%!important}}
    `;
    d.head.appendChild(style);

    const welcome=d.querySelector('#welcome .welcomeContent');
    if(welcome){
      const tag=welcome.querySelector('.tagline'); if(tag) tag.innerHTML='TU ESPACIO SEGURO<br>PARA SENTIR, SOLTAR<br>Y VOLVER A TI';
      if(!welcome.querySelector('.coverOrb')){const orb=d.createElement('div');orb.className='coverOrb';tag.insertAdjacentElement('afterend',orb)}
      const copy=welcome.querySelector('p'); if(copy) copy.textContent='Tu bienestar te acompaña siempre.';
      if(!welcome.querySelector('.mhtMark')){const m=d.createElement('div');m.className='mhtMark';m.innerHTML='<img src="'+logo+'"><span>MedHealingTours · Bienestar Integral</span>';welcome.appendChild(m)}
    }

    const space=d.getElementById('space');
    if(space && !space.querySelector('.logoSpace')){const title=space.querySelector('.title');const box=d.createElement('div');box.className='logoSpace';box.innerHTML='<img src="'+logo+'"><div><strong>MedHealingTours</strong><small>Tu bienestar te acompaña siempre.<br>Experiencias de salud, bienestar y transformación.</small></div>';title.insertAdjacentElement('afterend',box)}

    const patterns={

      energia:{name:'Busco energía',code:'4 · 4 · 4 · 4',desc:'Presencia y vitalidad',parts:[['Inhala',4,'in'],['Pausa',4,'hold'],['Exhala',4,'out'],['Pausa',4,'hold']]},
      claridad:{name:'Encontrar claridad',code:'6 · 2 · 4',desc:'Enfoque y mente despejada',parts:[['Inhala',6,'in'],['Pausa',2,'hold'],['Exhala',4,'out']]},
      emocional:{name:'Sanar emocionalmente',code:'4 · 4 · 6 · 2',desc:'Transiciones y emociones',parts:[['Inhala',4,'in'],['Pausa',4,'hold'],['Exhala',6,'out'],['Pausa',2,'hold']]},
      relaciones:{name:'Mejorar relaciones',code:'5.5 s',desc:'Empatía y conexión',parts:[['Inhala',5.5,'in'],['Exhala',5.5,'out']]},

    };
    w.kamiPatterns=patterns;

    const kamiPage=d.getElementById('kamiPage');
    if(kamiPage && !kamiPage.querySelector('.breathQuick')){const sug=kamiPage.querySelector('.suggestions');const q=d.createElement('div');q.className='breathQuick';q.innerHTML=Object.entries(patterns).map(([k,p])=>`<button data-breath="${k}"><b>${p.code}</b>${p.name}<small>${p.desc}</small></button>`).join('');sug.insertAdjacentElement('afterend',q);q.querySelectorAll('button').forEach(b=>b.onclick=()=>w.startBreath(b.dataset.breath));}

    const today=d.getElementById('today');
    if(today && !today.querySelector('.todayBreathStrip')){const intro=today.querySelector('.muted');const h=d.createElement('div');h.className='todayMiniTitle';h.textContent='Respira según lo que necesitas';const strip=d.createElement('div');strip.className='todayBreathStrip';strip.innerHTML=Object.entries(patterns).map(([k,p])=>`<button data-breath="${k}"><b>${p.name}</b><span>${p.code} · ${p.desc}</span></button>`).join('');intro.insertAdjacentElement('afterend',h);h.insertAdjacentElement('afterend',strip);strip.querySelectorAll('button').forEach(b=>b.onclick=()=>w.startBreath(b.dataset.breath));}

    const breath=d.getElementById('breath');
    if(breath && !breath.querySelector('.breathPicker')){const orb=breath.querySelector('#breathOrb');const picker=d.createElement('div');picker.className='breathPicker';picker.id='breathPicker';picker.innerHTML=Object.entries(patterns).map(([k,p])=>`<button data-breath="${k}">${p.name}<small>${p.code}</small></button>`).join('');orb.insertAdjacentElement('beforebegin',picker);picker.querySelectorAll('button').forEach(b=>b.onclick=()=>w.chooseBreath(b.dataset.breath));}

    const script=d.createElement('script');
    script.textContent=`
      let activeBreath='calma';
      function chooseBreath(key){activeBreath=key; if(typeof bt!=='undefined'){clearInterval(bt.timer);bt={elapsed:0,phaseIndex:0,phaseElapsed:0,paused:false,timer:null,sound:true,key};} renderBreathPicker(); setBreathCopy(); const o=document.getElementById('breathOrb');o.style.transition='none';o.style.transform='scale(.78)';document.getElementById('breathCount').textContent='—';document.getElementById('breathPhase').textContent='Prepárate';document.getElementById('breathProgress').style.width='0%';}
      function renderBreathPicker(){document.querySelectorAll('#breathPicker button').forEach(b=>b.classList.toggle('active',b.dataset.breath===activeBreath));}
      function setBreathCopy(){const p=window.kamiPatterns[activeBreath];const note=document.querySelector('#breath .page > div:nth-of-type(4)');if(note)note.innerHTML='<b>'+p.name+'</b> · '+p.code+'<br>'+p.desc;}
      function startBreath(key='calma'){show('breath');activeBreath=key;bt={elapsed:0,phaseIndex:0,phaseElapsed:0,paused:false,timer:null,sound:true,key};renderBreathPicker();setBreathCopy();applyBreath();bt.timer=setInterval(tickBreath,100)}
      function tickBreath(){if(bt.paused)return;bt.elapsed+=.1;bt.phaseElapsed+=.1;const p=window.kamiPatterns[activeBreath],part=p.parts[bt.phaseIndex];if(bt.phaseElapsed>=part[1]-.01){bt.phaseElapsed=0;bt.phaseIndex=(bt.phaseIndex+1)%p.parts.length;applyBreath()}if(bt.elapsed>=180){exitBreath();toast('Práctica completada. Aquí sigo contigo.');return}const cur=p.parts[bt.phaseIndex];document.getElementById('breathCount').textContent=Math.max(0,Math.ceil(cur[1]-bt.phaseElapsed));document.getElementById('breathProgress').style.width=(bt.elapsed/180*100)+'%'}
      function applyBreath(){const p=window.kamiPatterns[activeBreath],part=p.parts[bt.phaseIndex],o=document.getElementById('breathOrb');document.getElementById('breathPhase').textContent=part[0]+'…';document.getElementById('breathCount').textContent=Math.ceil(part[1]);o.style.transition='transform '+part[1]+'s ease-in-out,filter .5s';if(part[2]==='in')o.style.transform='scale(1.14)';else if(part[2]==='out')o.style.transform='scale(.78)';else o.style.transform='scale(1.03)'}
      window.chooseBreath=chooseBreath;window.startBreath=startBreath;window.tickBreath=tickBreath;window.applyBreath=applyBreath;
    `;
    d.body.appendChild(script);

    const oldQuick=d.querySelector('#kamiPage .suggestions button:nth-child(3)');if(oldQuick)oldQuick.onclick=()=>w.startBreath('calma');
    w.sendChat=function(){const i=d.getElementById('chatInput'),txt=i.value.trim();if(!txt)return;const log=d.getElementById('chat');const u=d.createElement('div');u.className='bubble u';u.textContent=txt;log.appendChild(u);i.value='';setTimeout(()=>{const k=d.createElement('div');k.className='bubble k';k.innerHTML='Gracias por contármelo. Aquí sigo contigo. Podemos continuar por escrito o elegir una respiración para este momento.<div class="breathQuick" style="margin-top:10px">'+Object.entries(patterns).map(([key,p])=>'<button data-breath="'+key+'"><b>'+p.code+'</b>'+p.name+'</button>').join('')+'</div>';log.appendChild(k);k.querySelectorAll('[data-breath]').forEach(b=>b.onclick=()=>w.startBreath(b.dataset.breath));k.scrollIntoView({behavior:'smooth',block:'end'})},350)};
  }catch(e){console.warn('KAMI patch',e)}
});
</script>
</body></html>
